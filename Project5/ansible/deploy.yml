---
- name: Deploy application on Docker EC2
  hosts: web
  become: yes

  tasks:
    - name: Stop existing container
      community.docker.docker_container:
        name: myapp
        state: absent

    - name: Pull latest Docker image
      community.docker.docker_image:
        name: ameen03/project5-app:latest
        source: pull

    - name: Run new container
      community.docker.docker_container:
        name: myapp
        image: ameen03/project5-app:latest
        state: started
        restart_policy: always
        ports:
          - "65:80"